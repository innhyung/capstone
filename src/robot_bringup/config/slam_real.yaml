slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 0.5        # 1.0→0.5: 맵 갱신/보정 더 빠르게
    resolution: 0.05
    max_laser_range: 8.0
    minimum_time_interval: 0.1      # 0.2→0.1: 스캔 더 자주 처리
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    scan_buffer_size: 35           # 20→35: 더 많은 과거 스캔으로 매칭 안정성 ↑
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 5.0   # 3.0→5.0: 더 멀리서도 loop closure 시도
    do_loop_closing: true   # 2026-06-04: 넓은 맵 전환 → 회전 누적 보정 위해 다시 켬. 단 임계값은 엄격하게(아래) 해서 가짜 loop 방지.
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.45   # 0.35→0.45: coarse 단계부터 확실한 후보만
    loop_match_minimum_response_fine: 0.50   # 0.35→0.50: 강한 매칭일 때만 loop closure 확정 (가짜 loop로 맵 비트는 것 방지)

    correlation_search_space_dimension: 0.3  # 2026-06-03 odom 정확해짐 → 탐색범위 0.5→0.3 다시 조임 (odom 예측 근처만 미세조정, 멀리 헤매는 것 방지)
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.3   # 0.5→0.3: odom 에서 벗어나면 더 강하게 페널티 (odom 신뢰 ↑)
    angle_variance_penalty: 1.0      # 2026-06-04: 0.5→1.0 되돌림. odom/IMU heading 바이어스를 그대로 받아적지 않게, scan-matching이 벽 보고 heading 스스로 교정하도록 신뢰 완화 (라이다 fixed_resolution 고쳐서 scan-match 신뢰 가능)

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.2   # 2026-06-04: 0.1(~6°)→0.2(~11°). heading 바이어스를 scan-matcher가 교정하려면 탐색 각도 여유가 필요. (라이다 고쳐서 가짜 회전 위험 ↓)
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
